# One entry per project. Order here = order on the site.
#
#   id:        short unique slug (no spaces)
#   name:      project name
#   summary:   one or two sentences
#   learned:   what you learned (optional)
#   built:     how it was built, shown as a tag (optional), e.g. "by hand", "with AI"
#   featured:  true = also shown on the home page
#   hidden:    true = keep it off the site for now
#   links:     list of { label, url }. Leave empty if there's nothing public yet.

- id: lab-results-api
  name: Vet lab results API
  summary: A small REST API that takes in veterinary lab results, validates them, matches them to a patient, flags out-of-range values, and returns each patient's history. Node, TypeScript, Express, and Prisma, with all-fake patients.
  learned: How to design and write a REST API in TypeScript. I'd used plenty of APIs, but never written one.
  built: by hand
  featured: true
  links:
    - { label: GitHub, url: https://github.com/browniewell/vet-lab-results-api }

- id: workout-tracker
  name: Workout consistency tracker
  summary: >-
    A tracker that asks "am I showing up?", not "am I getting stronger?" The one goal is simple: don't miss
    two days in a row. Still a work in progress.
  learned: Refining my TypeScript. Still early on.
  built: by hand
  featured: true
  links:
    - { label: GitHub, url: https://github.com/browniewell/workout-tracker }

- id: lute-box
  name: Lute Box
  summary: A one-page loot box game. Click to open a box, get a lute of some rarity, repeat. Very early days.
  learned: Just how fast AI can generate code.
  built: AI-written, hand-reviewed
  featured: true
  links:
    - { label: GitHub, url: https://github.com/browniewell/lute-box }

- id: personal-site
  name: ryanbrownewell.com
  summary: This site. A static site built with Astro and hosted on GitHub Pages, with no tracking.
  learned: How quickly AI can finish a simple project when someone technical is steering. It's a powerful tool, but it still needs careful stewardship.
  built: with AI
  links:
    - { label: GitHub, url: https://github.com/browniewell/personal-site }

